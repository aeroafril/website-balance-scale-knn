<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Balance Scale dengan knn</title>
    <link rel="stylesheet" href="{{url_for('static', filename='style.css')}}">
</head>
<body>
    <h2>Deteksi Balance Scale</h2>
    <form>
        <label for="LW">Left Weight: </label>
        <input type="text" inputmode="decimal" id="LW" placeholder="Left Weight" required>

        <label for="LD">Left Distance: </label>
        <input type="text" inputmode="decimal" id="LD" placeholder="Left Distance" required>

        <label for="RW">Right Weight: </label>
        <input type="text" inputmode="decimal" id="RW" placeholder="Right Weight" required>

        <label for="RD">Rigth Distance: </label>
        <input type="text" inputmode="decimal" id="RD" placeholder="Right Distance" required>

        <div class="button"></div>
            <input type="reset" id="reset">
            <input type="submit" id="submit">
        </div>
    </form>

    <h3 id="hasil"></h3>

    <script src="{{url_for('static', filename='script.js')}}"></script>
</body>
</html>
